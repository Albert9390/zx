<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 招聘报表管理系统</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <style>
        /* 登录页专用：居中卡片 */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 400px;
            max-width: 100%;
            padding: 40px 36px;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-brand .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: var(--signature-color);
            color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 6px var(--signature-light);
            font-size: 26px;
            font-weight: 700;
            font-family: var(--font-display);
            margin-bottom: 14px;
        }
        .login-brand h1 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 1px;
        }
        .login-brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .login-error {
            background: var(--danger-light);
            color: var(--danger-color);
            border: 1px solid rgba(191, 125, 125, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .login-logout {
            background: var(--info-light);
            color: var(--info-color);
            border: 1px solid rgba(135, 150, 181, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .login-card .btn {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-mark">招</span>
            <h1>招聘报表管理系统</h1>
            <p>请登录后使用</p>
        </div>

        <!-- 登录失败提示 -->
        <div class="login-error" th:if="${param.error}">
            用户名或密码错误，请重试
        </div>
        <!-- 已登出提示 -->
        <div class="login-logout" th:if="${param.logout}">
            您已安全退出
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="请输入用户名" required autofocus
                       style="width: 100%;">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="请输入密码" required
                       style="width: 100%;">
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>
    </div>
</div>

</body>
</html>
