<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 招聘报表管理系统</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}"><span class="brand-mark">招</span> 招聘报表管理系统</a>
    <ul class="navbar-nav">
        <li><a th:href="@{/}">首页</a></li>
        <li><a th:href="@{/page/position}">职位管理</a></li>
        <li><a th:href="@{/page/weekly}">每周招聘</a></li>
        <li><a th:href="@{/page/total}">总报表</a></li>
        <li><a th:href="@{/page/user}" class="active">用户管理</a></li>
    </ul>
    <div class="navbar-user">
        <span sec:authentication="name"></span>
        <a th:href="@{/logout}">退出</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h5>用户管理</h5>
            <button class="btn btn-primary btn-sm" onclick="openModal()">+ 新增用户</button>
        </div>
        <div class="card-body">
            <div class="table-wrapper">
                <table class="data-table" id="userTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>用户名</th>
                            <th>真实姓名</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 新增/编辑用户模态框 -->
<div class="modal-overlay" id="userModal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h5 id="modalTitle">新增用户</h5>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label class="form-label">用户名 *</label>
                <input type="text" class="form-control" id="username" placeholder="登录用户名" style="width: 100%;">
            </div>
            <div class="form-group" id="passwordGroup">
                <label class="form-label">密码 *</label>
                <input type="password" class="form-control" id="password" placeholder="登录密码" style="width: 100%;">
            </div>
            <div class="form-group">
                <label class="form-label">真实姓名</label>
                <input type="text" class="form-control" id="realName" placeholder="真实姓名" style="width: 100%;">
            </div>
            <div class="form-group">
                <label class="form-label">角色 *</label>
                <select class="form-select" id="role" style="width: 100%;">
                    <option value="USER">普通用户（仅每周招聘/总报表）</option>
                    <option value="ADMIN">管理员（全部页面）</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveUser()">保存</button>
        </div>
    </div>
</div>

<!-- 重置密码模态框 -->
<div class="modal-overlay" id="resetModal">
    <div class="modal-dialog" style="width: 440px;">
        <div class="modal-header">
            <h5>重置密码</h5>
            <button class="modal-close" onclick="closeResetModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="resetId">
            <div class="form-group">
                <label class="form-label">新密码 *</label>
                <input type="password" class="form-control" id="resetPassword" placeholder="请输入新密码" style="width: 100%;">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeResetModal()">取消</button>
            <button class="btn btn-primary" onclick="doResetPassword()">确认重置</button>
        </div>
    </div>
</div>

<script th:src="@{/static/js/user.js}"></script>
</body>
</html>
