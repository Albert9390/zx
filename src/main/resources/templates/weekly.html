<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每周招聘 - 招聘报表管理系统</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}"><span class="brand-mark">招</span> 招聘报表管理系统</a>
    <ul class="navbar-nav">
        <li><a th:href="@{/}">首页</a></li>
        <li><a th:href="@{/page/position}">职位管理</a></li>
        <li><a th:href="@{/page/weekly}" class="active">每周招聘</a></li>
        <li><a th:href="@{/page/total}">总报表</a></li>
    </ul>
</nav>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h5>每周招聘数据</h5>
            <div>
                <button class="btn btn-outline btn-sm" onclick="loadWeeks()">刷新</button>
                <button class="btn btn-primary btn-sm" onclick="openWeekModal()">+ 新增每周数据</button>
            </div>
        </div>
        <div class="card-body">
            <!-- 周列表 -->
            <div class="table-wrapper">
                <table class="data-table" id="weekTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>周</th>
                            <th>开始时间(周一)</th>
                            <th>结束时间(周日)</th>
                            <th>明细条数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="weekTbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 第一步：新增招聘周 模态框 -->
<div class="modal-overlay" id="weekModal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h5>新增招聘周</h5>
            <button class="modal-close" onclick="closeWeekModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">选择日期（默认为今天，自动定位到所在周）</label>
                <input type="date" class="form-control" id="weekPickerDate" onchange="onWeekDateChange()">
            </div>
            <div class="week-info-box">
                <div class="week-info-title" id="weekInfoTitle">--</div>
                <div class="week-info-dates">
                    <div>开始时间(周一)：<span id="weekInfoStart">--</span></div>
                    <div>结束时间(周日)：<span id="weekInfoEnd">--</span></div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeWeekModal()">取消</button>
            <button class="btn btn-primary" onclick="createWeekAndOpenDetail()">下一步：添加明细</button>
        </div>
    </div>
</div>

<!-- 第二步：周明细 模态框（展示所有需求职位，样式参考总报表） -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-dialog modal-xl">
        <div class="modal-header">
            <h5 id="detailModalTitle">添加明细</h5>
            <button class="modal-close" onclick="closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="detailWeekId">
            <!-- 职位搜索（下拉选择） -->
            <div class="filter-bar">
                <div class="filter-item">
                    <label>职位筛选:</label>
                    <select class="form-select" id="detailSearchSelect" style="width: 220px;" onchange="onDetailSearch()">
                        <option value="">全部职位</option>
                    </select>
                </div>
                <span class="filter-tip" id="detailSearchTip"></span>
            </div>
            <div class="table-wrapper detail-grid-wrapper">
                <table class="data-table" id="detailTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>需求职位</th>
                            <th>渠道</th>
                            <th>子渠道</th>
                            <th>简历收取</th>
                            <th>笔试安排<br>简历推送</th>
                            <th>笔试完成</th>
                            <th>笔试累计</th>
                            <th>初试</th>
                            <th>复试</th>
                            <th>录用</th>
                            <th>录用人选</th>
                            <th>签订三方<br>接受offer</th>
                            <th>拒签/<br>取消录用</th>
                            <th>违约</th>
                            <th>待签<br>三方</th>
                            <th>考虑中</th>
                            <th>待沟通</th>
                            <th>当周<br>报到数</th>
                            <th>当周<br>报到新人</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="detailTbody">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeDetailModal()" id="detailCancelBtn">取消</button>
            <button class="btn btn-primary" onclick="saveDetail()" id="detailSaveBtn">保存明细</button>
        </div>
    </div>
</div>

<script th:src="@{/static/js/weekly.js}"></script>
</body>
</html>
